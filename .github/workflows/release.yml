# Publish a release from a version tag.
#
# Order matters: nothing is published until the tag has been shown to agree with Cargo.toml and the checks
# have passed on that exact tree. Binaries are built before images, so the image build only copies a
# finished binary — which is why it needs no emulation (see the Containerfile).
#
# `cargo publish` is deliberately absent. A publish cannot be undone and yanking is not retraction, so the
# one irreversible step stays a deliberate act.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 2
  IMAGE: ghcr.io/${{ github.repository }}
  # Pinned so a release is reproducible and an upstream change cannot alter a build silently.
  ZIGLANG_VERSION: 0.16.0
  CARGO_ZIGBUILD_VERSION: 0.23.0

jobs:
  verify:
    name: verify the tag and re-run the checks
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      latest: ${{ steps.latest.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Every tag, because deciding what `latest` means requires comparing against all of them.
          fetch-depth: 0

      - name: The tag must agree with Cargo.toml
        id: version
        run: |
          set -euo pipefail
          crate=$(cargo metadata --no-deps --format-version 1 --locked \
                    | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$crate" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $crate"
            exit 1
          fi
          echo "version=$crate" >> "$GITHUB_OUTPUT"

      # `latest` means the highest version, not the most recent build. Tagging whatever is currently
      # building would move `latest` backwards when an older line gets a fix release.
      - name: Decide whether this tag is `latest`
        id: latest
        run: |
          set -euo pipefail
          highest=$(git tag --list 'v*' | grep -v -- '-' | sort -V | tail -1)
          if [ "$GITHUB_REF_NAME" = "$highest" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$GITHUB_REF_NAME is not the highest tag ($highest); not tagging latest"
          fi

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  build:
    name: ${{ matrix.target }}
    needs: verify
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            platform: linux/amd64
          - target: aarch64-unknown-linux-musl
            platform: linux/arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ matrix.target }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
          restore-keys: cargo-${{ matrix.target }}-

      # Zig supplies the C toolchain the crypto provider needs, for both targets, from one runner. Nothing
      # else packages a C cross compiler for aarch64-musl. Installed from PyPI, as the README describes,
      # rather than through a third-party action.
      - name: Install Zig and cargo-zigbuild
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check "ziglang==${ZIGLANG_VERSION}"
          cargo install cargo-zigbuild --version "${CARGO_ZIGBUILD_VERSION}" --locked

      - name: Build
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}

      # A dynamically linked "static" binary only reveals itself on someone else's machine, so assert it
      # here rather than hope.
      - name: It must be static
        run: |
          set -euo pipefail
          bin=target/${{ matrix.target }}/release/heliobridge
          file "$bin"
          file "$bin" | grep -q 'statically linked'
          if ldd "$bin" 2>&1 | grep -qv 'not a dynamic executable'; then
            echo "::error::$bin is dynamically linked"; ldd "$bin"; exit 1
          fi

      - name: Stage for packaging
        run: |
          set -euo pipefail
          mkdir -p dist/${{ matrix.platform }}
          cp target/${{ matrix.target }}/release/heliobridge dist/${{ matrix.platform }}/heliobridge
          cp target/${{ matrix.target }}/release/heliobridge \
             dist/heliobridge-${{ needs.verify.outputs.version }}-${{ matrix.target }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-${{ matrix.target }}
          path: dist
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub Release
    needs: [verify, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history and every tag, so the notes can span from the previous release.
          fetch-depth: 0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: build-*
          merge-multiple: true
          path: dist

      # Notes from commit subjects rather than from GitHub's generator, which lists merged pull requests
      # and would be empty for a release built from direct commits. The convention here — an imperative
      # subject summarising the result — means a subject already reads as a release-note line.
      - name: Notes
        run: |
          set -euo pipefail
          previous=$(git tag --list 'v*' --sort=-v:refname \
                       | grep -v -- '-' \
                       | grep -v "^${GITHUB_REF_NAME}$" \
                       | head -1 || true)
          # The version-bump commit says nothing in its own release notes.
          subjects() { git log --no-merges --reverse --pretty='- %s' "$@" | grep -v '^- Release [0-9]'; }
          {
            if [ -n "$previous" ]; then
              echo "## Changes since ${previous}"
              echo
              subjects "${previous}..${GITHUB_REF_NAME}"
              echo
              echo "**Full changelog**: https://github.com/${GITHUB_REPOSITORY}/compare/${previous}...${GITHUB_REF_NAME}"
            else
              echo "## Changes"
              echo
              subjects "${GITHUB_REF_NAME}"
            fi
            echo
            echo "Binaries are statically linked musl builds; verify with \`sha256sum -c SHA256SUMS\`."
            echo "Container image: \`ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME#v}\`"
          } > dist/NOTES.md
          cat dist/NOTES.md

      - name: Checksums
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum heliobridge-* > SHA256SUMS
          cat SHA256SUMS

      - name: Attest the binaries
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/heliobridge-*

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file dist/NOTES.md \
            $prerelease \
            dist/heliobridge-* dist/SHA256SUMS

  image:
    name: Container image
    needs: [verify, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: build-*
          merge-multiple: true
          path: dist

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # latest comes from the comparison in `verify`, not from this action's own notion of it.
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ needs.verify.outputs.latest == 'true' }}
          labels: |
            org.opencontainers.image.title=heliobridge
            org.opencontainers.image.licenses=Apache-2.0

      # No QEMU anywhere in this job: the image only copies a finished binary and runs nothing during the
      # build, so both architectures are assembled natively.
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: dist
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true

      - name: Attest the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
